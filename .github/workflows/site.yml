name: Site

# Deployment is `pnpm run deploy` under `doppler run` (wrangler), plus the
# settag/cloudflare stack in the terraform repo — not this workflow. This only
# proves the build still succeeds, so a broken commit is caught in the PR rather
# than at deploy time.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/site.yml"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: site

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # `defaults.run` does not apply to action steps, so the package and lock
      # paths are explicit. Dependency installation remains a named step below.
      - uses: pnpm/setup@v2
        with:
          package-json-file: site/package.json
          runtime: node@24
          cache: true
          cache-dependency-path: site/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The site is served as static assets by a Worker that runs no code. If
      # prerendering silently stops emitting markup, the build still "succeeds"
      # but ships an empty shell.
      - name: Verify the page was prerendered
        run: |
          test -f dist/client/index.html
          grep -aq "Nothing about your library leaves the machine." dist/client/index.html
