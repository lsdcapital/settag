name: CI

# The site is built and deployed separately, so changes confined to it should
# not spend five Python jobs.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python claims. 3.14 matters most: it is the
        # only one that resolves the separate essentia-tensorflow cp314 build.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9
        with:
          enable-cache: true
          prune-cache: true

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest
