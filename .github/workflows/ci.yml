name: CI

# The site is built and deployed separately, so changes confined to it should
# not spend five Python jobs.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**"]
  pull_request:
    paths-ignore: ["site/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python claims. 3.14 matters most: it is the
        # only one that resolves the separate essentia-tensorflow cp314 build.
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      # A pyproject change that leaves uv.lock stale would otherwise pass every
      # job here and only surface as a different resolution on someone's machine.
      - name: Check the lockfile is current
        run: uv lock --check

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

  # `uv sync` installs the project editable from src/, so every check above
  # passes even if the wheel itself is broken. Build and install the real
  # artifact here so a packaging break fails the PR instead of the release.
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: package

      - name: Build
        run: uv build --python 3.12

      - name: Smoke-test the built wheel
        run: |
          package_version="$(uv run --python 3.12 python -c 'import settag; print(settag.__version__)')"
          test -f "dist/settag-${package_version}.tar.gz"
          test -f "dist/settag-${package_version}-py3-none-any.whl"
          uv venv /tmp/smoke --python 3.12
          uv pip install \
            --python /tmp/smoke/bin/python \
            "dist/settag-${package_version}-py3-none-any.whl"
          cd /tmp
          reported="$(/tmp/smoke/bin/settag --version)"
          echo "installed wheel reports: ${reported}"
          case "${reported}" in
            *"${package_version}"*) ;;
            *) echo "settag --version did not report ${package_version}" >&2; exit 1 ;;
          esac
