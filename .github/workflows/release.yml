name: Release

on:
  push:
    tags: ["v*"]

# Nothing is granted at the top level. The build job needs no write access at
# all, and the publish job requests exactly what it uses.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true
          cache-suffix: py${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --group dev --python ${{ matrix.python-version }}

      # A tag can be pushed at a commit that never went through branch CI, so
      # the release gate repeats every claimed Python-version check.
      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Test
        run: uv run pytest

  build:
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          prune-cache: true

      - name: Install build environment
        run: uv sync --group dev --python 3.12

      - name: Build
        run: uv build

      # The version lives in src/settag/__init__.py and is stamped into the
      # files SetTag tags. Releasing v1.2.3 from a tree that says 1.2.2 would
      # publish artifacts that mislabel every track they touch.
      - name: Verify the tag matches the package version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(uv run python -c 'import settag; print(settag.__version__)')"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${package_version}." >&2
            echo "Update src/settag/__init__.py or retag before releasing." >&2
            exit 1
          fi
          test -f "dist/settag-${package_version}.tar.gz"
          test -f "dist/settag-${package_version}-py3-none-any.whl"

      # `uv sync` installs the project editable from src/, so every check above
      # passes even if the wheel itself is broken — a missing subpackage or a
      # dead entry point would ship unnoticed. Install the actual artifact into
      # a clean environment instead, with no source tree on the path.
      - name: Smoke-test the built wheel
        run: |
          package_version="$(uv run python -c 'import settag; print(settag.__version__)')"
          uv venv /tmp/smoke --python 3.12
          uv pip install \
            --python /tmp/smoke/bin/python \
            "dist/settag-${package_version}-py3-none-any.whl"
          cd /tmp
          reported="$(/tmp/smoke/bin/settag --version)"
          echo "installed wheel reports: ${reported}"
          case "${reported}" in
            *"${package_version}"*) ;;
            *) echo "settag --version did not report ${package_version}" >&2; exit 1 ;;
          esac

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    # Requires a PyPI Trusted Publisher for lsdcapital/settag with workflow
    # release.yml and environment name `pypi`, plus a GitHub environment of the
    # same name. If PyPI's publisher is configured without an environment,
    # delete this block — a mismatch fails the OIDC exchange.
    environment:
      name: pypi
      url: https://pypi.org/p/settag

    permissions:
      # Mints the OIDC token PyPI trades for an upload token. No API token or
      # long-lived secret is stored anywhere.
      id-token: write
      # Creating the GitHub release.
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      # After PyPI, not before: a failed upload should not leave a published
      # GitHub release pointing at a version nobody can install.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            dist/*
