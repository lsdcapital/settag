[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "settag"
version = "0.1.0"
description = "A safe, analysis-first Essentia music tagger for DJ libraries"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.15"
authors = [
  { name = "LSD Capital" },
]
dependencies = [
  "essentia-tensorflow==2.1b6.dev1389; python_version < '3.14'",
  "essentia-tensorflow>=2.1b6.dev1438; python_version >= '3.14'",
  "mutagen>=1.47,<2",
  "numpy>=1.26,<3",
  "textual>=8,<9",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
settag = "settag.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/settag"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
