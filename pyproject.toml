[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "settag"
dynamic = ["version"]
description = "A safe, analysis-first Essentia music tagger for DJ libraries"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10,<3.15"
authors = [
  { name = "LSD Capital" },
]
keywords = [
  "dj",
  "essentia",
  "genre-classification",
  "id3",
  "music-library",
  "tagging",
]

# Windows is absent on purpose: essentia-tensorflow publishes no Windows or
# Linux-ARM wheels, so those platforms cannot install SetTag at all.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
  "essentia-tensorflow==2.1b6.dev1389; python_version < '3.14'",
  "essentia-tensorflow>=2.1b6.dev1438; python_version >= '3.14'",
  "mutagen>=1.47,<2",
  "numpy>=1.26,<3",
  "textual>=8,<9",
  "tomli>=2; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/lsdcapital/settag"
Repository = "https://github.com/lsdcapital/settag"
Issues = "https://github.com/lsdcapital/settag/issues"
Changelog = "https://github.com/lsdcapital/settag/releases"

[project.scripts]
settag = "settag.cli:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "ruff>=0.16,<1",
  "tomli>=2",
  "ty>=0.0.18,<0.1",
]

# Single-sourced from the package, because __version__ is written into the
# files SetTag tags (SETTAG_VERSION) and into analysis records. A version that
# drifted from the distribution would mislabel a user's library.
[tool.hatch.version]
path = "src/settag/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/settag"]

# The marketing site shares this repository but is not part of the distribution.
# Without this, hatchling's default "everything not ignored" sdist would ship
# site/ to PyPI inside every release.
[tool.hatch.build.targets.sdist]
exclude = [
  "site/",
  ".github/",
  ".conductor/",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
  "A",     # shadowing a builtin
  "ARG",   # arguments that are never used
  "ASYNC", # blocking calls in async code
  "B",     # bugbear
  "C4",    # comprehensions
  "DTZ",   # naive datetimes; every timestamp SetTag stores is UTC
  "E",     # pycodestyle errors
  "EXE",   # shebang and executable-bit mismatches
  "F",     # pyflakes
  "FA",    # missing `from __future__ import annotations`
  "FLY",   # static string joins
  "FURB",  # outdated idioms
  "G",     # logging call formatting
  "I",     # import order
  "ISC",   # implicit string concatenation
  "LOG",   # logging misuse
  "PERF",  # avoidable overhead
  "PIE",   # unnecessary code
  "PLC",   # pylint conventions
  "PLE",   # pylint errors
  "PT",    # pytest style
  "RET",   # return statements
  "RUF",   # ruff-specific
  "SIM",   # simplification
  "TID",   # import hygiene
  "UP",    # pyupgrade
  "W",     # pycodestyle warnings
]
ignore = [
  # Per-item error isolation is the point in the analyze and write loops: one
  # bad track must not abandon the batch.
  "PERF203",
  # Textual declares BINDINGS and CSS as plain class attributes; annotating
  # each one ClassVar fights the framework's own idiom.
  "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Fixture and monkeypatch signatures often accept arguments they do not read.
"tests/*" = ["ARG"]
